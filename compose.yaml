services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: https://novicereader.com
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: https://novicereader.com
    expose:
      - "3000"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgresql+psycopg://novicereader:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a root .env file before running docker compose}@postgres:5432/novicereader"
    expose:
      - "8000"
    volumes:
      - ./backend/storage:/app/backend/storage
      - ./backend/db:/app/backend/db

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novicereader
      POSTGRES_USER: novicereader
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a root .env file before running docker compose}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novicereader -d novicereader"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
